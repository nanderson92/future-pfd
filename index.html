<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Systems Atlas - Interactive Process Atlas</title>
    <meta name="description" content="Future Systems Atlas is an interactive process-engineering map of 115 frontier technologies, decomposed into chemicals, unit operations, bottlenecks, readiness, and evidence." />
    <meta property="og:title" content="Future Systems Atlas - Interactive Process Atlas" />
    <meta property="og:description" content="115 frontier technologies mapped as process systems: chemicals, unit operations, bottlenecks, readiness, and evidence posture." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Future Systems Atlas - Interactive Process Atlas" />
    <meta name="twitter:description" content="An interactive process-engineering map of 115 frontier technologies." />
    <meta name="twitter:image" content="./og-cover.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #07110f;
        color: #f4f8f6;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root:empty::before {
        content: "Loading Future Systems Atlas...";
        display: grid;
        min-height: 100vh;
        place-items: center;
        color: #c5ccc8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const root = document.getElementById("root");

      async function boot() {
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "./dist/assets/index.css";
        document.head.appendChild(stylesheet);
        await import("./dist/assets/index.js");
      }

      boot().catch((error) => {
        console.error(error);
        root.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#07110f;color:#f4f8f6">
            <section style="max-width:680px;border:1px solid rgba(230,242,255,.18);border-radius:8px;padding:24px;background:rgba(230,242,255,.05)">
              <h1 style="margin:0 0 12px;font-size:28px">Future Systems Atlas could not load.</h1>
              <p style="margin:0;color:#c5ccc8;line-height:1.6">The static build assets are missing or blocked. Run <code>npm run build</code> and deploy this root page with the generated <code>dist/</code> folder.</p>
            </section>
          </main>`;
      });
    </script>
  </body>
</html>
